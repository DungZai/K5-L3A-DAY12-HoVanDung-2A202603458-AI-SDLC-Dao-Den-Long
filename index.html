<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1430">
  <title>Đảo Đèn Lồng</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="game" aria-label="Đảo Đèn Lồng">
    <div id="world" aria-label="Cảnh 3D"></div>
    <div id="screen-feedback" aria-hidden="true"></div>
    <section id="hud" aria-label="Trạng thái của Mây" hidden>
      <div class="hud-top">
        <div class="hud-card identity">
          <p id="night-label"></p>
          <div id="flames" class="flames"></div>
        </div>
        <div class="hud-card clock"><span>Bình minh</span><strong id="timer">04:00</strong></div>
        <div class="hud-card result-stats">
          <div><span>Đèn</span><strong id="lit">0 / 5</strong><small id="light-goal"></small></div>
          <div><span>Điểm</span><strong id="score">0</strong></div>
        </div>
      </div>
      <div id="guide-arrow" class="guide-arrow" hidden aria-label="Hướng đèn chưa sáng gần nhất">↑</div>
      <div id="shade-arrow" class="shade-arrow" hidden aria-label="Hướng Bóng Mực mới xuất hiện">↑</div>
      <div class="hud-bottom">
        <p id="visual-notices" aria-live="polite"></p>
        <p id="hint" role="status"></p>
        <p id="notice" role="status"></p>
        <div class="hud-card inventory">
          <div class="inventory-label"><span>Đom đóm</span><strong id="carried">0 / 10</strong></div>
          <div id="mote-slots" class="mote-slots" aria-hidden="true"></div>
        </div>
      </div>
      <div class="hud-card abilities">
        <div><kbd id="key-guide-dash">Shift</kbd><span>Lướt</span><strong id="dash-status">Sẵn sàng</strong></div>
        <div><kbd id="key-guide-pulse">Q</kbd><span>Tỏa Sáng</span><strong id="pulse-status">Sẵn sàng</strong></div>
      </div>
    </section>
    <footer id="controls" class="controls" aria-label="Điều khiển" hidden>
      <span><kbd id="key-guide-move">W A S D</kbd> Di chuyển</span>
      <span><kbd id="key-guide-jump">Space</kbd> Nhảy</span>
      <span><kbd id="key-guide-interact">E</kbd> Nạp đèn</span>
      <span><kbd>← →</kbd> Xoay góc nhìn</span>
      <span><kbd id="key-guide-pause">Esc</kbd> Tạm dừng</span>
    </footer>
    <section id="overlay" class="overlay" aria-labelledby="overlay-title">
      <div class="panel">
        <div class="seal" aria-hidden="true"><i></i></div>
        <p class="chapter" id="overlay-chapter"></p>
        <h1 id="overlay-title">Đảo Đèn Lồng</h1>
        <p id="overlay-copy">Đang chuẩn bị đảo…</p>
        <div id="menu-actions" class="menu-actions"></div>
        <div id="settings" class="settings" hidden>
          <label for="volume">Âm lượng <output id="volume-value"></output></label>
          <input id="volume" type="range" min="0" max="100" step="1">
          <label for="sensitivity">Độ nhạy chuột <output id="sensitivity-value"></output></label>
          <input id="sensitivity" type="range" min="25" max="200" step="5">
          <label class="settings-toggle" for="colorblind">Bảng màu dễ phân biệt
            <input id="colorblind" type="checkbox">
          </label>
          <label class="settings-toggle" for="reduced-motion">Giảm chuyển động
            <input id="reduced-motion" type="checkbox">
          </label>
          <label class="settings-toggle" for="large-text">Chữ lớn
            <input id="large-text" type="checkbox">
          </label>
        </div>
        <div id="keybindings" class="keybindings" hidden>
          <div id="key-rows" class="key-rows"></div>
          <p id="key-feedback" role="status">Chọn hành động rồi nhấn phím mới.</p>
        </div>
        <form id="score-form" class="score-form" hidden>
          <label for="score-name">Tên trên bảng xếp hạng</label>
          <div class="score-input">
            <input id="score-name" name="name" required minlength="3" maxlength="12" pattern="[A-Za-z0-9_]{3,12}"
              placeholder="VD May_01" autocomplete="off" aria-describedby="score-feedback">
            <button type="submit" id="score-submit">Lưu điểm</button>
          </div>
          <p id="score-feedback" role="status">Dùng 3–12 chữ cái, chữ số hoặc dấu gạch dưới.</p>
        </form>
        <div id="leaderboard" class="leaderboard" hidden>
          <p id="leaderboard-status" role="status"></p>
          <table aria-label="Bảng xếp hạng cục bộ">
            <thead><tr><th>Hạng</th><th>Tên</th><th>Điểm</th><th>Đêm</th><th>Ngày ghi</th></tr></thead>
            <tbody id="leaderboard-rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.mjs"></script>
</body>
</html>
